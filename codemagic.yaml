# CRUX — Codemagic workflow (free tier: 500 min/month macOS M2, no Mac needed)
# Phase 1 (now): build Xcode app for iOS simulator + run SwiftPM unit tests.
#   Simulator build/tests need NO Apple Developer account and NO signing.
# Phase 2 (after $99 purchase): add archive/signing workflow for TestFlight.

workflows:
  crux-tests:
    name: CRUX Build + Tests (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build app (simulator, no signing)
        script: |
          xcodebuild -project CRUX.xcodeproj -scheme CRUX \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests (SwiftPM)
        script: |
          # CRUX UI target now compiles on macOS (#if os(iOS) guards), so the
          # official full-package 'swift test' works for the CRUXCore tests.
          swift test
    artifacts:
      - .build/**/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com
