# CRUX — Codemagic workflow (free tier: 500 min/month macOS M2, no Mac needed)
# Phase 1 (now): build Xcode app for iOS simulator + run SwiftPM unit tests.
#   Simulator build/tests need NO Apple Developer account and NO signing.
# Phase 2 (after $99 purchase): add archive/signing workflow for TestFlight.

workflows:
  crux-tests:
    name: CRUX Build + Tests (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build app (simulator, no signing)
        script: |
          xcodebuild -project CRUX.xcodeproj -scheme CRUX \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests (SwiftPM, CRUXCore only)
        script: |
          # Build ONLY the test dependency chain (CRUXCore + tests) so the
          # iOS-only CRUX UI target (SwiftUI/UIKit) is not compiled on macOS.
          swift build --target CRUXCoreTests
          # swift test --skip-build expects the package-level discovery bundle
          # (CRUXPackageTests.xctest) which --target does not produce; run the
          # built CRUXCoreTests bundle directly instead.
          TEST_BUNDLE=$(find .build -name 'CRUXCoreTests.xctest' -maxdepth 4 | head -1)
          if [ -n "$TEST_BUNDLE" ]; then
            "$TEST_BUNDLE/Contents/MacOS/CRUXCoreTests"
          else
            .build/arm64-apple-macosx/debug/CRUXCoreTests
          fi
    artifacts:
      - .build/**/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com
