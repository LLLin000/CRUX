*{box-sizing:border-box}
html,body{margin:0;background:#030405;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:active{opacity:.75;transform:scale(.99)}
body{overscroll-behavior:none}
.shell{min-height:100vh;display:flex;justify-content:center;background:#030405}
.app{width:min(100%,430px);min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;padding-bottom:112px}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.topbar{padding:20px 24px 10px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(11,12,14,.98) 68%,rgba(11,12,14,0));backdrop-filter:blur(14px)}
.topbar .title{text-align:center;font-size:20px;font-weight:800;letter-spacing:-.02em}
.circle-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:21px;display:grid;place-items:center}
.circle-btn.accent{background:var(--accent);color:var(--accentText);border-color:transparent}
.hero-title{text-align:center;padding:18px 20px 26px}
.hero-title h1{font-size:32px;line-height:1;margin:0;font-weight:850;letter-spacing:-.04em}
.hero-title p{margin:9px 0 0;color:var(--muted);font-size:14px}
.section{padding:0 18px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px}
.calendar-card{padding:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow{text-align:center;color:#6f747b;font-size:11px;font-weight:700;padding:4px 0 7px}
.day{aspect-ratio:1;border:0;border-radius:16px;background:#1a1c20;color:#93989e;font-size:12px;position:relative;display:grid;place-items:center}
.day.today{background:var(--accent);color:var(--accentText);font-weight:800}
.day.has::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;bottom:6px;background:var(--routeColor,var(--blue));box-shadow:0 0 10px color-mix(in srgb,var(--routeColor,var(--blue)) 65%,transparent)}
.day.thumb::before{content:"";position:absolute;inset:8px;border-radius:11px;background:linear-gradient(145deg,var(--routeColor,var(--blue)),#20262d);opacity:.8}
.day.thumb span{position:relative;z-index:2;color:white;font-weight:800}
.month-summary{display:grid;grid-template-columns:1.4fr .8fr;gap:12px;margin-top:14px}
.summary-card{padding:20px;min-height:136px;display:flex;flex-direction:column;justify-content:space-between}
.summary-card strong{font-size:31px;letter-spacing:-.04em}
.summary-card small{color:var(--muted);font-size:12px}
.mini-stack{position:relative;overflow:hidden}
.mini-stack::before,.mini-stack::after{content:"";position:absolute;width:62px;height:82px;background:#f6f6f5;border-radius:10px;top:18px;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.mini-stack::before{left:22px;transform:rotate(-9deg);background:linear-gradient(145deg,#244a67,#c9ff45)}
.mini-stack::after{right:17px;transform:rotate(8deg);background:linear-gradient(145deg,#5c2e61,#4aa8ff)}
.album-head{padding:20px 22px 6px;text-align:center}
.album-head h1{margin:0;font-size:25px}
.album-head p{margin:13px 0 0;color:var(--muted);font-size:13px}
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px;padding:28px 24px 26px}
.stamp{border:0;background:transparent;color:var(--text);text-align:center}
.stamp-ring{width:138px;height:138px;max-width:100%;margin:auto;border-radius:50%;border:2px solid #48505a;display:grid;place-items:center;position:relative;background:#111316}
.stamp-ring::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px dashed #41474f}
.stamp-art{width:75px;height:75px;position:relative}
.rock{position:absolute;background:var(--c);border-radius:48% 52% 62% 38%/40% 60% 40% 60%;box-shadow:inset 0 3px 7px rgba(255,255,255,.18)}
.stamp-name{margin-top:9px;font-weight:760;font-size:13px}
.stamp-meta{margin-top:4px;color:var(--muted);font-size:11px}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(calc(100% - 34px),396px);height:74px;display:grid;grid-template-columns:1fr 1fr 70px;gap:10px;z-index:50}
.tab-pill{display:grid;grid-template-columns:1fr 1fr;background:#17191c;border:1px solid var(--line);border-radius:28px;padding:6px}
.nav-btn{border:0;background:transparent;color:#727880;border-radius:22px;font-size:11px;font-weight:750;display:grid;place-items:center;gap:2px}
.nav-btn b{font-size:21px;line-height:1}
.nav-btn.active{background:#24272b;color:var(--accent)}
.add-btn{border-radius:28px;border:1px solid var(--line);background:var(--accent);color:var(--accentText);font-size:36px;font-weight:300}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(12px);z-index:70;opacity:0;pointer-events:none;transition:.2s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120%);width:min(calc(100% - 28px),402px);z-index:80;transition:.25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:translate(-50%,0)}
.action-option{width:100%;height:90px;border-radius:26px;border:1px solid #353a40;background:rgba(22,24,27,.96);color:white;display:grid;grid-template-columns:56px 1fr 28px;align-items:center;text-align:left;padding:0 20px;margin-bottom:10px}
.action-icon{width:44px;height:44px;border-radius:50%;background:#202328;display:grid;place-items:center;color:var(--accent);font-size:20px}
.action-option strong{font-size:16px}

['cameraInput','galleryInput'].forEach(id=>{
  document.getElementById(id).addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{setPhotoData(r.result);closeOverlay();historyStack.push('add');openScreen('add',false)};r.readAsDataURL(f);
  });
});
function cancelAdd(){goBack()}
function toggleFocus(id){document.getElementById(id).classList.toggle('focus')}
function setRouteColor(color,btn){
  selectedColor=color;
  document.documentElement.style.setProperty('--route',colorMap[color]);
  document.documentElement.style.setProperty('--routeHue',hueMap[color]);
  document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
}
function showModal(title,text,opts=[],onSelect=null){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalText').textContent=text||'';
  const box=document.getElementById('modalOptions');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='modal-option';b.textContent=o;
    b.onclick=()=>{if(onSelect)onSelect(o);closeOverlay()};
    box.appendChild(b);
  });
  document.getElementById('sheetBg').classList.add('show');
  document.getElementById('modal').classList.add('show');
}
function openDay(day){
  const found=routes.filter(r=>{
    if(r.date==='今天') return day===14;
    const m=r.date.match(/月\s*(\d+)\s*日/);
    return m ? Number(m[1])===day : false;
  });
  showModal(`${8} 月 ${day} 日`,found.length?`${found.length} 条路线`:'暂无记录',
    found.length?found.map(r=>`${r.grade} · ${r.name} · ${r.status}`):['＋ 添加路线'],
    o=>{if(o.startsWith('＋')){useDemoPhoto();}else{const r=found.find(x=>o.includes(x.name));if(r)openRoute(r.id)}}
  );
}
function chooseGym(){showModal('选择岩馆','',gyms.map(g=>g.name),v=>document.getElementById('gymValue').textContent=v)}
function chooseGrade(){showModal('选择等级','',['V1','V2','V3','V4','V5','V6','V7','V8'],v=>document.getElementById('gradeValue').textContent=v)}
function chooseStatus(){showModal('选择结果','',['Flash','完攀 / Top','Project'],v=>document.getElementById('statusValue').textContent=v)}
function openDatePicker(){const i=document.getElementById('nativeDate');if(i.showPicker)i.showPicker();else i.click()}
document.getElementById('nativeDate').addEventListener('change',e=>{
  if(!e.target.value)return;const d=new Date(e.target.value);
  document.getElementById('dateValue').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
});
function stepTry(n){tries=Math.max(1,tries+n);document.getElementById('triesValue').textContent=tries}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),ss=s%60,t=Math.floor((ms%1000)/100);return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${t}`}
function tick(){if(!timerRunning)return;timerElapsed=performance.now()-timerStart;document.getElementById('timerValue').textContent=fmt(timerElapsed);timerRAF=requestAnimationFrame(tick)}
function toggleTimer(){
  const b=document.getElementById('timerBtn');
  if(!timerRunning){timerRunning=true;timerStart=performance.now()-timerElapsed;b.textContent='停止';tick()}
  else{timerRunning=false;cancelAnimationFrame(timerRAF);b.textContent='继续'}
}
function saveRecord(){
  const statusText=document.getElementById('statusValue').textContent;
  const payload={
    name:`${selectedColor==='blue'?'蓝':selectedColor==='red'?'红':selectedColor==='yellow'?'黄':selectedColor==='green'?'绿':'紫'}线 · ${editingId?'Edited Route':'New Route'}`,
    gym:document.getElementById('gymValue').textContent,city:'杭州',date:'今天',
    grade:document.getElementById('gradeValue').textContent,
    status:statusText.includes('Project')?'PROJECT':statusText.includes('Flash')?'FLASH':'TOP',
    tries,time:document.getElementById('timerValue').textContent,color:selectedColor,
    note:document.getElementById('noteValue').value||'暂无备注'
  };
  if(editingId){
    const idx=routes.findIndex(r=>r.id===editingId);
    if(idx>=0) routes[idx]={...routes[idx],...payload};
    toast('路线已更新');
    editingId=null;
  }else{
    routes.unshift({id:Date.now(),...payload});
    toast('路线已保存');
  }
  renderStamps();openMain('today');document.getElementById('monthCount').innerHTML=`${routes.length} <span style="font-size:14px;color:var(--muted)">条路线</span>`;
}
function stampHTML(r,index){
  const c=colorMap[r.color]||colorMap.blue;
  return `<button class="stamp" onclick="openRoute(${r.id})">
    <div class="stamp-ring" style="border-color:${c}88">
      <div class="stamp-art">
        <i class="rock" style="--c:${c};width:19px;height:14px;left:5px;bottom:10px"></i>
        <i class="rock" style="--c:${c};width:26px;height:17px;left:22px;bottom:27px;transform:rotate(-18deg)"></i>
        <i class="rock" style="--c:${c};width:18px;height:15px;right:5px;top:14px"></i>
        <i class="rock" style="--c:${c};width:30px;height:15px;left:17px;top:4px;transform:rotate(9deg)"></i>
      </div>
    </div>
    <div class="stamp-name">${r.grade} · ${r.name}</div>
    <div class="stamp-meta">${r.gym} · ${r.date}</div>
  </button>`;
}
function renderStamps(){
  let rs=[...routes];
  if(filter==='project')rs=rs.filter(r=>r.status==='PROJECT');
  if(filter==='top')rs=rs.filter(r=>r.status!=='PROJECT');
  if(filter==='v5')rs=rs.filter(r=>parseInt(r.grade.slice(1))>=5);
  document.getElementById('stampGrid').innerHTML=rs.map(stampHTML).join('');
  document.getElementById('routeCount').textContent=routes.length;
  document.getElementById('gymCount').textContent=gyms.length;
}
function openFilter(){
  showModal('所有路线','筛选图鉴',['全部','已完攀','Project','V5+'],v=>{filter=v==='Project'?'project':v==='已完攀'?'top':v==='V5+'?'v5':'all';renderStamps()});
}
function openRoute(id){
  const r=routes.find(x=>x.id===id);if(!r)return;currentRouteId=id;
  document.getElementById('detailName').textContent=r.name;
  document.getElementById('detailGym').textContent=`${r.gym} · ${r.date}`;
  document.getElementById('detailGrade').textContent=r.grade;
  document.getElementById('detailStatus').textContent=r.status;
  document.getElementById('detailTries').textContent=r.tries;
  document.getElementById('detailTime').textContent=r.time;
  document.getElementById('detailNote').textContent=r.note;
  selectedColor=r.color;document.documentElement.style.setProperty('--route',colorMap[r.color]||colorMap.blue);document.documentElement.style.setProperty('--routeHue',hueMap[r.color]||'0deg');
  openScreen('detail');
}
function editCurrent(){
  const r=routes.find(x=>x.id===currentRouteId);if(!r)return;
  editingId=currentRouteId;
  document.getElementById('gymValue').textContent=r.gym;document.getElementById('gradeValue').textContent=r.grade;document.getElementById('statusValue').textContent=r.status==='PROJECT'?'Project':r.status==='FLASH'?'Flash':'完攀 / Top';tries=r.tries;document.getElementById('triesValue').textContent=tries;document.getElementById('noteValue').value=r.note;openScreen('add');
}
function deleteCurrent(){
  const i=routes.findIndex(x=>x.id===currentRouteId);if(i>=0)routes.splice(i,1);renderStamps();toast('已删除');openMain('routes');
}
function openGym(idx){
  const g=gyms[idx];document.getElementById('gymNameDetail').textContent=g.name;document.getElementById('gymCityDetail').textContent=g.city;
  const rs=routes.filter(r=>r.gym===g.name);document.getElementById('gymMetaDetail').textContent=`${rs.length} 条路线 · 最高 ${rs.sort((a,b)=>parseInt(b.grade.slice(1))-parseInt(a.grade.slice(1)))[0]?.grade||'--'}`;
  document.getElementById('gymStampGrid').innerHTML=rs.map(stampHTML).join('');openScreen('gymDetail');
}
renderStamps();
</script>
</body>
</html>
